name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

# A newer push to the same ref makes the older run's result irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            global.json

      # Windows runners cannot run Linux containers, so Testcontainers' postgres image cannot start.
      # The runner image ships PostgreSQL as a disabled service; the test suites use it through
      # INDYPOS_TEST_POSTGRES and create one throwaway database per fixture.
      - name: Start PostgreSQL service
        shell: pwsh
        run: |
          $service = Get-Service -Name '*postgres*' | Select-Object -First 1
          if (-not $service) { throw 'No PostgreSQL service found on this runner image.' }
          Write-Host "Using service $($service.Name)"

          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name

          # Resolve psql from PGBIN when the image sets it, else from PATH.
          $psql = if ($env:PGBIN) { Join-Path $env:PGBIN 'psql.exe' } else { (Get-Command psql).Source }

          # The runner image documents user postgres with password root. It is a throwaway
          # loopback server on a disposable VM, so the well-known password is fine.
          $env:PGPASSWORD = 'root'

          $output = ''
          $ready = $false
          foreach ($attempt in 1..30) {
            $output = & $psql -h localhost -U postgres -d postgres -c 'select 1' 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw "PostgreSQL did not accept connections within 60 seconds. Last error: $output" }

          & $psql -h localhost -U postgres -d postgres -c 'select version()'
          if ($LASTEXITCODE -ne 0) { throw 'select version() failed.' }

          'INDYPOS_TEST_POSTGRES=Host=localhost;Port=5432;Username=postgres;Password=root' |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        run: dotnet build IndyPOS.sln -c Release

      - name: Test solution
        run: dotnet test IndyPOS.sln -c Release --no-build --logger trx --results-directory TestResults

      # The installer is not part of IndyPOS.sln. It builds itself and is independent of the
      # solution's tests, so it still runs (and reports) when a solution test fails.
      - name: Test installer
        if: ${{ !cancelled() }}
        run: dotnet test tests/IndyPOS.Bootstrapper.Tests -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
